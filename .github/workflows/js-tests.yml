# .github/workflows/js-tests.yml
name: JS Tests

on:
  workflow_call:
    inputs:
      desktop:
        # Fork: apps/desktop is upstream's Electron app; the fork ships no desktop and has
        # no commits in it, and its leg is the slowest in CI (~20 min on a 4-core runner).
        # ci.yml turns it on only for a PR touching apps/desktop, apps/shared or the root
        # npm tree. Defaults on so any other caller keeps the full matrix.
        description: Include the apps/desktop package in the matrix
        type: boolean
        default: true

jobs:
  workspaces:
    name: List npm workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 26: what the production image ships (Dockerfile node_source stage) and what
          # upstream tests against. 22 tested a runtime nothing ships (voice-prefs failed on it).
          node-version: 26
          cache: npm
      - name: Use npm 12
        # Node 26's bundled npm can fall in the range package.json's engines excludes
        # (<11.10 || >=11.17), and .npmrc sets engine-strict. Same step as upstream.
        run: npm --version | grep -q '^12\.' || npm i -g npm@12
      - uses: ./.github/actions/retry
        with:
          command: npm ci --ignore-scripts
      - id: set-matrix
        env:
          DESKTOP: ${{ inputs.desktop }}
        run: |
          PACKAGES=$(npm query .workspace | jq -c --argjson desktop "$DESKTOP" \
            '[.[].location | select($desktop or . != "apps/desktop")]')
          echo "desktop leg: $DESKTOP -> $PACKAGES"
          if [ "$PACKAGES" = "[]" ] || [ -z "$PACKAGES" ]; then
            echo "::error::Workspace discovery produced an empty package list — refusing to emit a zero-length matrix (would skip all JS/TS checks silently)."
            exit 1
          fi
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"

  check:
    name: Typecheck & Test
    needs: workspaces
    runs-on: ubuntu-latest
    # apps/desktop (typecheck, ~2.4k vitest tests, an Electron pack, then fix) took 20m02s on a
    # 4-core runner at v2026.9.24 and was cancelled by a 20-minute cap with every step green.
    # Upstream runs the same payload as one 32-core job under 30 minutes.
    timeout-minutes: 35
    strategy:
      matrix:
        package: ${{ fromJson(needs.workspaces.outputs.packages) }}
      fail-fast: false # report all failures, not just the first one
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 26: what the production image ships (Dockerfile node_source stage) and what
          # upstream tests against. 22 tested a runtime nothing ships (voice-prefs failed on it).
          node-version: 26
          cache: npm
      - name: Use npm 12
        # Node 26's bundled npm can fall in the range package.json's engines excludes
        # (<11.10 || >=11.17), and .npmrc sets engine-strict. Same step as upstream.
        run: npm --version | grep -q '^12\.' || npm i -g npm@12
      - uses: ./.github/actions/retry
        with:
          command: npm ci
      - run: npm run --prefix ${{ matrix.package }} check
      - run: npm run --prefix ${{ matrix.package }} fix
