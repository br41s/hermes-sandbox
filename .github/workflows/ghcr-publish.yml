name: Build and Publish to GHCR

on:
  push:
    branches: [main]

# One build per branch; a newer push cancels the one it supersedes.
#
# Merging a batch of PRs otherwise starts a full ~4-minute image build per
# merge, and every build but the last is already stale — its commit is no
# longer main by the time it publishes.
#
# The cost is deliberate: a cancelled build never publishes its
# `sha-<commit>`, so those intermediate commits cannot be deployed and
# `scripts/deploy.sh` will refuse them by design. That is acceptable because
# the rollback target is the previous commit that was actually DEPLOYED, and
# that image exists precisely because deploying it published it — nobody rolls
# back to an intermediate merge commit. If one is ever needed, re-run this
# workflow on it.
concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: true

# Only run on this fork, not if someone forks br41s/hermes-sandbox further.
# Remove or update this condition if you rename the repo.
jobs:
  build-and-push:
    if: github.repository == 'br41s/hermes-sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── The tag contract with scripts/deploy.sh ───────────────────────────
      # deploy.sh derives `sha-$(git rev-parse --short=9 HEAD)` and then POLLS
      # /opt/hermes/.hermes_build_sha until the running pod reports that exact
      # string. Both sides must agree on the abbreviation length, or the deploy
      # points the service at a tag that was never pushed and the rollout dies
      # as "Service Image Pull Failed" (PR #197/#198).
      #
      # The length cannot be left to git: it picks one from the repository's
      # object count, so a full local clone abbreviates to 9 while the shallow
      # clone actions/checkout makes by default abbreviates to 7. Same commit,
      # different tag. `--short=9` pins it on both sides.
      - name: Derive short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=9 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # Two tags, ONE image — mirrors cloudbuild.yaml: `:latest` is mutable
          # and overwritten every build; `:sha-<commit>` is immutable and is
          # both the rollback anchor and the tag deploy.sh moves the service to.
          # Publishing only `:latest` (as this workflow used to) cannot deploy
          # anything: Zeabur reconciles on a spec change, and a floating tag
          # never looks changed.
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ steps.sha.outputs.short }}
          # Stamps /opt/hermes/.hermes_build_sha. Without it that file is absent
          # and `deploy.sh --status` reports "production : UNKNOWN" — the only
          # mechanism that can say which commit is live. cloudbuild.yaml passes
          # the same arg; upstream's docker.yml passes the FULL github.sha,
          # which would not match deploy.sh's short form.
          build-args: |
            HERMES_GIT_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
