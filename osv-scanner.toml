# --- apps/desktop chain, part 2: verified absent from the image ---------------
# Same decision as the electron/tar/extract-zip block above, and the same
# expiry — but these three earned it by a stricter check rather than by
# inheriting the label. `devDependency` is NOT sufficient grounds here: the
# Dockerfile's `npm install` carries no `--omit=dev`, so plenty of dev packages
# DO ship in the image. What matters is whether the package is actually there.
#
# Checked inside the running container (2026-09-18, commit d63986da5):
#   /opt/hermes/node_modules/@xmldom/xmldom   absent
#   /opt/hermes/node_modules/fast-uri         absent
#   /opt/hermes/node_modules/shell-quote      absent
#   (electron, tar likewise absent — confirming the block above)
#
# They reach the lockfile only through apps/*, which the image never installs.
# The dev packages that ARE present — brace-expansion, js-yaml, browserslist,
# undici-under-jsdom — were PATCHED instead of listed here, because "present but
# probably not executed" is not a decision this file should be asked to carry.
#
# Re-verify with the same check if the Dockerfile's npm install ever changes.
[[IgnoredVulns]]
