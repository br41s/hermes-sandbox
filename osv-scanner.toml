# --- hermes-agent: advisories against the package we ARE ----------------------
# osv-scanner resolves our own published package out of uv.lock and matches
# two VulDB-sourced advisories. Neither carries a fixed version, so OSV treats
# the affected range as unbounded and NO upgrade can ever clear them — they
# have to be closed by decision or not at all.
[[IgnoredVulns]]
id = "CVE-2026-10224"
reason = "Uncontrolled resource consumption in the Feishu webhook handler. The code lives at plugins/platforms/feishu/adapter.py::_handle_webhook_request in this fork (NOT the advisory's gateway/platforms/feishu.py path) and is explicitly bounded against this class: per-IP rate limit, Content-Type guard, early Content-Length reject, a bounded reader capped at 1 MB, a 30s read timeout, and aiohttp client_max_size as a backstop. Mitigated in code; re-check if those guards are ever relaxed. Verified 2026-09-18."
[[IgnoredVulns]]
id = "CVE-2026-10221"
reason = "Stated affected range is 'up to 0.12.0'; we ship 0.19.0. OSV records no fixed version, so the range defaults to all-versions and no upgrade clears it. Re-check run_agent.py::_compress_context if the advisory is ever given a concrete fixed version."

# --- cryptography: deferred to upstream, deliberately -------------------------
# We pin cryptography==46.0.7 explicitly (it arrives via PyJWT[crypto]) so the
# WeCom/Weixin crypto paths cannot drift below the CVE-2026-39892/34073 floor.
# The remaining advisories are the bundled-OpenSSL class, open on upstream/main
# too. Decided in PR #38: adopt when upstream bumps, rather than freelancing a
# transitive pin ahead of it — a fork that runs ahead here re-merges badly and
# we gain nothing the container's own OpenSSL does not already govern.
# Time-boxed so "waiting on upstream" cannot silently become "forever".
[[IgnoredVulns]]
