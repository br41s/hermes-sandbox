# --- Electron desktop app: not in the production image ------------------------
# The root package-lock.json describes the whole monorepo workspace set, but
# the Dockerfile only installs root/web/ui-tui — apps/* (the desktop app) is
# never `npm install`ed into the image (see Dockerfile, HERMES_TUI_DIR comment).
# These three are devDependencies of that desktop build chain. They are real
# for a developer running `npm install --workspace apps/desktop` locally, and
# worth patching on the desktop app's own cadence, but they are NOT production
# exposure for the Hermes control plane. NOT suppressed permanently: time-boxed
# so the desktop app is forced to answer for them rather than inheriting
# silence from a decision made about the server.
