# OSV-Scanner accepted-risk register — root lockfiles (uv.lock, package-lock.json).
#
# WHAT BELONGS HERE: an advisory we have consciously decided NOT to fix, with
# the reason. Suppressing here rather than filtering in the reporter keeps the
# rationale next to the pin it justifies, so the next person to read
# `pyproject.toml` finds the same decision from the other direction.
#
# WHAT DOES NOT BELONG HERE: "we haven't got to it yet". An unsuppressed alert
# is the backlog; this file is the decision log. The queue reached 242 open
# alerts because nothing distinguished the two — do not re-merge them.
#
# HOW TO ADD ONE: state which of the four triage classes it is (accepted /
# unreachable / patchable / real-exposure) and why. Anything that is merely
# *inconvenient* to patch is not accepted — leave it alerting.
#
# REVIEW: entries without `ignoreUntil` are permanent decisions and are
# re-read whenever the underlying pin moves. Entries with `ignoreUntil` expire
# on their own and start alerting again — prefer those for "waiting on
# upstream", so the wait cannot become permanent by accident.
#
# Triage of record: docs/security/dependency-alert-triage.md (2026-09-18).

# --- starlette: bumping REGRESSES the fix we pinned for -----------------------
# We pin starlette==1.0.1 across every extra that exposes a Starlette-backed
# server surface, for CVE-2026-48710 (BadHost: a malformed Host header desyncs
# request.url.path from the dispatched path, so middleware gating on
# request.url can be bypassed — the dashboard OAuth gate is exactly that shape).
# The scanner's suggested 1.1.0/1.3.x line does not carry that fix forward.
# Upstream NousResearch/hermes-agent holds 1.0.1 for the same reason; moving
# alone would also diverge us ahead of upstream on an unvetted version.
# Re-evaluate when a release carries BOTH the BadHost fix and these.
[[IgnoredVulns]]
id = "CVE-2026-48818"
reason = "starlette pinned 1.0.1 for CVE-2026-48710 (BadHost); the suggested upgrade regresses that fix. See pyproject.toml [all]/mcp/web extras."
[[IgnoredVulns]]
id = "CVE-2026-54283"
