name: cron_routing
description: >
  Scheduled jobs must deliver to an explicit destination, never to a frozen
  'origin' that points at a private DM. After the profiles migration, jobs kept
  posting to the old DM because deliver="origin" freezes routing to the creation
  site. This audits the live cron jobs for that hazard.

scenario:
  kind: function_call
  module: fork_evals.checks.cron_routing
  function: audit_summary
  args: []   # audit the live cron jobs

assertions:
  - text: >
      The audit reports that it examined a non-zero number of live cron jobs and
      found none using frozen 'origin' delivery to a private DM or to a forum
      group without a thread.
    check:
      must_contain: ["OK"]
      # "audited 0" is a vacuous pass — nothing was examined, so the audit
      # cannot evidence the claim. It must not read as green.
      must_not_contain: ["FAIL", "audited 0"]

source_hints:
  - cron/jobs.py
  - cron/scheduler.py
  - fork_evals/checks/cron_routing.py
